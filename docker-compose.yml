services:
  users-db:
    image: postgres:16-alpine
    container_name: sicae-users-db
    environment:
      POSTGRES_DB: sicaeUsuario
      POSTGRES_USER: sicae_usuario_app
      POSTGRES_PASSWORD: sicae123
    ports:
      - "5432:5432"
    volumes:
      - users-db-data:/var/lib/postgresql/data
      - ./database/users/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sicae-network

  auth-service:
    build:
      context: ./services/auth-service
    container_name: sicae-auth-service
    environment:
      JWT_SECRET: sicae-dev-secret-key-muy-larga-y-segura-12345
      USERS_DB_URL: jdbc:postgresql://users-db:5432/sicaeUsuario
      USERS_DB_USER: sicae_usuario_app
      USERS_DB_PASSWORD: sicae123
    ports:
      - "8081:8080"
    depends_on:
      users-db:
        condition: service_healthy
    networks:
      - sicae-network

  user-service:
    build:
      context: ./services/user-service
    container_name: sicae-user-service
    environment:
      JWT_SECRET: sicae-dev-secret-key-muy-larga-y-segura-12345
      USERS_DB_URL: jdbc:postgresql://users-db:5432/sicaeUsuario
      USERS_DB_USER: sicae_usuario_app
      USERS_DB_PASSWORD: sicae123
    ports:
      - "8082:8082"
    depends_on:
      users-db:
        condition: service_healthy
    networks:
      - sicae-network

  vehicles-db:
    image: mysql:8.0
    container_name: sicae-vehicles-db
    environment:
      MYSQL_DATABASE: sicaevehiculo
      MYSQL_USER: sicae_vehiculo_app
      MYSQL_PASSWORD: sicae123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3307:3306"
    volumes:
      - vehicles-db-data:/var/lib/mysql
      - ./database/vehicles/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sicae-network

  vehicle-service:
    build:
      context: ./services/vehicle-service
    container_name: sicae-vehicle-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://vehicles-db:3306/sicaevehiculo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Mexico_City
      SPRING_DATASOURCE_USERNAME: sicae_vehiculo_app
      SPRING_DATASOURCE_PASSWORD: sicae123
      JWT_SECRET: sicae-dev-secret-key-muy-larga-y-segura-12345
    ports:
      - "8083:8083"
    depends_on:
      vehicles-db:
        condition: service_healthy
    networks:
      - sicae-network

  parking-service:
    build:
      context: ./services/parking-service
    container_name: sicae-parking-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://parking-db:3306/sicaeEstacionamiento?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Mexico_City
      SPRING_DATASOURCE_USERNAME: sicae_estacionamiento_app
      SPRING_DATASOURCE_PASSWORD: sicae123
      JWT_SECRET: sicae-dev-secret-key-muy-larga-y-segura-12345
    ports:
      - "8084:8080"
    depends_on:
      parking-db:
        condition: service_healthy
    networks:
      - sicae-network

  parking-db:
    image: mysql:8.0
    container_name: sicae-parking-db
    environment:
      MYSQL_DATABASE: sicaeEstacionamiento
      MYSQL_USER: sicae_estacionamiento_app
      MYSQL_PASSWORD: sicae123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3308:3306"
    volumes:
      - parking-db-data:/var/lib/mysql
      - ./database/parking/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sicae-network

  adminer:
    image: adminer:4
    container_name: sicae-adminer
    profiles:
      - tools
    ports:
      - "8090:8080"
    depends_on:
      users-db:
        condition: service_healthy
      vehicles-db:
        condition: service_healthy
      parking-db:
        condition: service_healthy
    networks:
      - sicae-network

volumes:
  users-db-data:
  vehicles-db-data:
  parking-db-data:

networks:
  sicae-network:
    driver: bridge
